" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.9063" x="55" y="225.3638">Sistema</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.4985" x="118.0386" y="225.3638">presenta formulario con los datos actuales precargados</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.3003" x="55" y="240.4966">• Nombre de usuario (modificable)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.376" x="55" y="255.6294">• Contraseña (modificable)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.708" x="55" y="270.7622">• Rol asignado (modificable solo por Administrador)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.6006" x="55" y="285.895">• Permite solicitar guardar cambios</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.103" x="55" y="301.0278">• Permite solicitar cancelar edición</text></g><!--link EditandoUsuario to *end*editarUsuario--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="23" id="lnk6"><path d="M44,381.5769 C44,407.8769 44,442.5669 44,461.2769" fill="none" id="EditandoUsuario-to-*end*editarUsuario" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="44,467.2769,48,458.2769,44,462.2769,40,458.2769,44,467.2769" style="stroke:#008000;stroke-width:1;"/><path d="M49,404.2969 L49,444.2969 L524,444.2969 L524,414.2969 L514,404.2969 L49,404.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M514,404.2969 L514,414.2969 L524,414.2969 L514,404.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="