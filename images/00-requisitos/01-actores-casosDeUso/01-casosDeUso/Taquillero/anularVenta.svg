IERTA.MotivoCancelacion"><rect fill="#F1F1F1" height="76.2969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="182.0918" x="319.5" y="599.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="319.5" x2="501.5918" y1="645.8906" y2="645.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.0918" x="339.5" y="627.5889">Motivo de Anulación</text></g><g id="VENTA_ABIERTA.PendienteReembolso"><rect fill="#F1F1F1" height="76.2969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="192.5371" x="314" y="711.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="314" x2="506.5371" y1="757.8906" y2="757.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.5371" x="334" y="739.5889">Reembolso Pendiente</text></g><ellipse cx="410.5" cy="426.5938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="410.5" cy="834.5938" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="410.5" cy="834.5938" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="26" data-uid="ent0003" id="entity_GMN2"><path d="M528,472.5938 L528,514.5938 L509.73,518.5938 L528,522.5938 L528,563.125 A0,0 0 0 0 528,563.125 L865.1245,563.125 A0,0 0 0 0 865.1245,563.125 L865.1245,482.5938 L855.1245,472.5938 L528,472.5938 A0,0 0 0 0 528,472.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M855.1245,472.5938 L855.1245,482.5938 L865.1245,482.5938 L855.1245,472.5938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124.1855" x="544" y="499.6606">Sistema muestra</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.7319" x="672.3179" y="499.6606">los datos de la venta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.8438" x="544" y="514.7935">(máquina, tickets, total, método de pago).</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="184.666" x="544" y="529.9263">Sistema permite solicitar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.3262" x="732.7983" y="529.9263">anular mediante</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.6436" x="544" y="545.0591">introducirMotivo().</text></g><g class="entity" data-entity="GMN5" data-source-line="34" data-uid="ent0006" id="entity_GMN5"><path d="M519.5,600.0938 L519.5,633.5938 L501.53,637.5938 L519.5,641.5938 L519.5,675.4922 A0,0 0 0 0 519.5,675.4922 L857.8623,675.4922 A0,0 0 0 0 857.8623,675.4922 L857.8623,610.0938 L847.8623,600.0938 L519.5,600.0938 A0,0 0 0 0 519.5,600.0938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M847.8623,600.0938 L847.8623,610.0938 L857.8623,610.0938 L847.8623,600.0938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="232.5146" x="535.5" y="627.1606">Taquillero/Supervisor introduce</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="60.7153" x="772.147" y="627.1606">el motivo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.0845" x="535.5" y="642.2935">de la anulación (obligatorio).</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="107.6689" x="535.5" y="657.4263">Sistema valida</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.2979" x="647.3013" y="657.4263">que el motivo no esté vacío.</text></g><g class="entity" data-entity="GMN8" data-source-line="41" data-uid="ent0009" id="entity_GMN8"><path d="M525.5,712.0938 L525.5,745.5938 L507.25,749.5938 L525.5,753.5938 L525.5,787.4922 A0,0 0 0 0 525.5,787.4922 L855.8071,787.4922 A0,0 0 0 0 855.8071,787.4922 L855.8071,722.0938 L845.8071,712.0938 L525.5,712.0938 A0,0 0 0 0 525.5,712.0938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M845.8071,712.0938 L845.8071,722.0938 L855.8071,722.0938 L845.8071,712.0938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="121.5576" x="541.5" y="739.1606">Sistema registra</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.0371" x="667.1899" y="739.1606">la anulación de la venta.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="114.8101" x="541.5" y="754.2935">Sistema genera</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.3892" x="660.4424" y="754.2935">un Reembolso en estado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.3071" x="541.5" y="769.4263">pendiente de autorización por el Supervisor.</text></g><!--link *start*VENTA_ABIERTA to VisualizacionVenta--><g class="link" data-entity-1=".start.VENTA_ABIERTA" data-entity-2="VisualizacionVenta" data-source-line="24" data-uid="lnk6" id="link_.start.VENTA_ABIERTA_VisualizacionVenta"><path d="M410.5,436.7338 C410.5,447.1538 410.5,458.0338 410.5,473.7238" fill="none" id="*start*VENTA_ABIERTA-to-VisualizacionVenta" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="410.5,479.7238,414.5,470.7238,410.5,474.7238,406.5,470.7238,410.5,479.7238" style="stroke:#008000;stroke-width:1;"/