00" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.9419" x="241.0259" y="271.3438">anular una venta registrada.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="128.7622" x="22" y="286.4766">Sistema presenta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.4263" x="154.8945" y="286.4766">el detalle de la venta seleccionada.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.7051" x="467.9678" y="278.9102">anularVenta()</text></g><!--link VENTA_ABIERTA to VENTAS_ABIERTO_FINAL--><g class="link" data-entity-1="VENTA_ABIERTA" data-entity-2="VENTAS_ABIERTO_FINAL" data-source-line="49" data-uid="lnk11" id="link_VENTA_ABIERTA_VENTAS_ABIERTO_FINAL"><path d="M540.67,855.3069 C540.67,894.1469 540.67,923.7469 540.67,949.0569" fill="none" id="VENTA_ABIERTA-to-VENTAS_ABIERTO_FINAL" style="stroke:#008000;stroke-width:1;"/><polygon fill="#008000" points="540.67,955.0569,544.67,946.0569,540.67,950.0569,536.67,946.0569,540.67,955.0569" style="stroke:#008000;stroke-width:1;"/><path d="M54.67,910.1769 L54.67,970.1769 L376.67,970.1769 L376.67,920.1769 L366.67,910.1769 L54.67,910.1769" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M366.67,910.1769 L366.67,920.1769 L376.67,920.1769 L366.67,910.1769" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="128.1655" x="70.67" y="937.2438">Sistema confirma</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.4238" x="202.9679" y="937.2438">la anulación registrada</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.0249" x="70.67" y="952.3766">y regresa al listado de ventas.</text><text fill=