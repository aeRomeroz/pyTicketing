family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="136.4175" x="808.3603" y="870.4566">Supervisor solicita</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.8633" x="948.9101" y="870.4566">cancelar la operación.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="132.5645" x="808.3603" y="885.5894">Sistema mantiene</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.1147" x="945.0571" y="885.5894">la máquina inactiva</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.9692" x="808.3603" y="900.7222">y regresa al listado de máquinas.</text></g><!--link MAQUINAS_ABIERTO_FINAL to *end*--><g class="link" data-entity-1="MAQUINAS_ABIERTO_FINAL" data-entity-2=".end." data-source-line="59" data-uid="lnk13" id="link_MAQUINAS_ABIERTO_FINAL_.end."><path d="M585.67,949.6669 C585.67,982.7769 585.67,1022.4569 585.67,1043.2169" fill="none" id="MAQUINAS_ABIERTO_FINAL-to-*end*" style="stroke:#0000FF;stroke-width:1;"/><polygon fill="#0000FF" points="585.67,1049.2169,589.67,1040.2169,585.67,1044.2169,581.67,1040.2169,585.67,1049.2169" style="stroke:#0000FF;stroke-width:1;"/></g><!--SRC=[dLJRQjj047tNLopkIrA8cxwQO51D2eRORPssBo64iJIsDvPsbRqOdDAFoGVqgP_W7-kih5tBifH01JRIxipPC-VCZk4cGpP3I0pVW6AJtSkJvG8YlUQY00Kv4p95ZGNxU7bPMrKWrgUh6HTejWKogSnArZQ-GffoiQJmAD863B99_Et7U1hVFiIVnjUpxryUnjFnQ1pVCD2irzpi7ITLot4zrg_rkl0_qrSNUdJt_fvTtBrRAaHnVp7iP1T5dRnRqWFF0LDUuWcK0f-THq8IpGmNXadXb5j7Z9wh-V3M5gWsN4l5jCnumWrSVPWF3nZC2c2vjyfbfP02Iv7DuH7w0OThWpcmGf61eWB9W2ruiYgZimPAueW0aqN2Tt-5Yw2L1LSv7Kdh_lnojn-XI9ch8UemvrU9kT_xoRM5Z3zJhXIL1AKNjOtgID-2lLhwgABXicU11R5r48VD2c5MvqdcEfocmMs4oi3I5SMNAx9bqHtMa3Ytg8sg59QQ_33k_rHYzsmPf1kEYWvwidYYB7rHrLQ1shs470UwsVqHYNLlskg2vESflJlJj0s1HGRFG4VaqaY2u98quai15De_Odveii8YCVMjfieYWl4X9yUKWo3E-8Y9fRYw4MVdU_13JxYlLjVh