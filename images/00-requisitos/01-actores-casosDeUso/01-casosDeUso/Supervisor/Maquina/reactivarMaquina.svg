os suspendidos con su</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.519" x="576.17" y="545.0591">plaza y motorario asignados.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="192.8545" x="576.17" y="560.1919">Supervisor puede solicitar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="62.8481" x="773.1568" y="560.1919">confirmar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.1025" x="576.17" y="575.3247">mediante ejecutarReactivacion().</text></g><g class="entity" data-entity="GMN5" data-source-line="37" data-uid="ent0006" id="entity_GMN5"><path d="M576.67,630.0938 L576.67,663.5938 L558.46,667.5938 L576.67,671.5938 L576.67,705.4922 A0,0 0 0 0 576.67,705.4922 L908.6148,705.4922 A0,0 0 0 0 908.6148,705.4922 L908.6148,640.0938 L898.6148,630.0938 L576.67,630.0938 A0,0 0 0 0 576.67,630.0938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M898.6148,630.0938 L898.6148,640.0938 L908.6148,640.0938 L898.6148,630.0938" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="108.6401" x="592.67" y="657.1606">Sistema marca</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.2466" x="705.4425" y="657.1606">la máquina como activa.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="125.8232" x="592.67" y="672.2935">Sistema restaura</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.9893" x="722.6256" y="672.2935">los vínculos suspendidos</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLengt